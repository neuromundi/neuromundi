# Configuración de despliegue en Netlify para una SPA con Vite + React Router.
# Las variables VITE_SUPABASE_URL y VITE_SUPABASE_ANON_KEY se definen en
# Site settings → Environment variables (no se versionan).

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Todas las rutas no-archivo caen en index.html (enrutado del lado del cliente).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache agresivo para los assets con hash; el HTML siempre fresco.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
